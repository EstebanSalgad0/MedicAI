# API Gateway de MedicAI: único punto expuesto al exterior.
#   /webhook          -> whatsapp-gateway (público, protegido por firma de Meta)
#   /api/auth/login   -> analytics (público)
#   /api/...          -> microservicios, solo con token JWT válido (auth_request)
#   /                 -> dashboard
# Las rutas /dialog e /internal/ de los servicios nunca se exponen.

resolver 127.0.0.11 valid=10s ipv6=off;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /webhook {
    limit_req zone=webhook burst=60 nodelay;
    set $up http://whatsapp-gateway:8000;
    proxy_pass $up/webhook$is_args$args;
  }

  location = /health { return 200 "ok\n"; }

  # ---- autenticación ----
  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    set $up http://analytics:8000;
    proxy_pass $up/auth/login;
  }
  location = /_auth {
    internal;
    # variable propia: las subpeticiones comparten variables con la petición principal
    set $auth_upstream http://analytics:8000;
    proxy_pass $auth_upstream/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }

  # ---- nunca exponer endpoints internos ----
  location ~ ^/api/[a-z-]+/(internal/|dialog) { return 404; }

  # ---- simulador ----
  location = /api/chat {
    auth_request /_auth;
    set $up http://orchestrator:8000;
    proxy_pass $up/chat;
  }
  location ~ ^/api/outbox/(?<who>web:[A-Za-z0-9-]+)$ {
    auth_request /_auth;
    set $up http://whatsapp-gateway:8000;
    proxy_pass $up/outbox/$who;
  }

  # ---- APIs de los microservicios para el dashboard ----
  location ~ ^/api/(?<svc>analytics|agendamiento|recordatorios|derivacion|medicamentos|orientacion|resultados|atencion)(?<rest>/.*)$ {
    auth_request /_auth;
    set $target $svc;
    if ($svc != "analytics") { set $target ms-$svc; }
    proxy_pass http://$target:8000$rest$is_args$args;
  }

  location / {
    set $up http://dashboard:80;
    proxy_pass $up;
  }
}
