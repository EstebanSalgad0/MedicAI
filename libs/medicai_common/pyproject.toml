[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medicai-common"
version = "1.0.0"
description = "Contratos y utilidades compartidas por los microservicios de MedicAI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "PyJWT>=2.8",
]

[tool.setuptools]
packages = ["medicai_common"]
